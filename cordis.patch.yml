# Canonical DSH tools use the collision-resistant
# native_browser_* namespace. They require a running local Broker, native host
# registration and the configured approval policy. Default personal mode needs
# a personal Broker; restricted mode additionally requires extension tab consent.
# Opt in to browser_* compatibility aliases with legacyToolNames: true.
- insert:
    - id: native-browser
      name: dsh-native-browser
